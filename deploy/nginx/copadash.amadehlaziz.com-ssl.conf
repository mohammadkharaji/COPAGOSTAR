# HTTPS vhost for copadash.amadehlaziz.com. Enable only after the certificate is in place:
#   /etc/nginx/ssl/copadash.amadehlaziz.com/fullchain.pem   (leaf + intermediates)
#   /etc/nginx/ssl/copadash.amadehlaziz.com/privkey.pem     (0600, root)
# or, with Let's Encrypt, point the two ssl_* lines at /etc/letsencrypt/live/copadash.amadehlaziz.com/.
server {
    listen 443 ssl http2;
    server_name copadash.amadehlaziz.com;

    ssl_certificate     /etc/nginx/ssl/copadash.amadehlaziz.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/copadash.amadehlaziz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
