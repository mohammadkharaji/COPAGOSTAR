# copadash.amadehlaziz.com -> sr-api (uvicorn on 127.0.0.1:8000)
# Install: /etc/nginx/sites-available/copadash.amadehlaziz.com, symlinked into sites-enabled.
# HTTPS: enable copadash.amadehlaziz.com-ssl.conf (certificate in /etc/nginx/ssl/copadash.amadehlaziz.com/)
# BEFORE installing this file, because this vhost only redirects to it.
server {
    listen 80;
    server_name copadash.amadehlaziz.com;

    # ACME HTTP-01 challenges (certbot --webroot -w /var/www/acme)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    # Plain HTTP never reaches the app: logins and session cookies must only travel over HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}
