# copadash.amadehlaziz.com -> sr-api (uvicorn on 127.0.0.1:8000)
# Install: /etc/nginx/sites-available/copadash.amadehlaziz.com, symlinked into sites-enabled.
# HTTPS: once /etc/nginx/ssl/copadash.amadehlaziz.com/{fullchain.pem,privkey.pem} exist,
# enable copadash.amadehlaziz.com-ssl.conf and switch the "location /" below to the redirect.
server {
    listen 80;
    server_name copadash.amadehlaziz.com;

    # ACME HTTP-01 challenges (certbot --webroot -w /var/www/acme)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        # After HTTPS is live replace this block with:
        #   return 301 https://$host$request_uri;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
